<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشيخ عبد الحكيم مصطفاوي - البطاقة الرقمية</title>
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- خطوط Google Fonts (Cairo & Amiri) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,400&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f7f8fa;
            --card-bg: #ffffff;
            --gold-primary: #d4af37;
            --gold-dark: #b89122;
            --gold-light: #fefcf0;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-button: linear-gradient(135deg, #d4af37 0%, #b89122 100%);
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --border-color: #f1f3f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            color: var(--text-dark);
        }

        .nfc-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.08), 0 5px 15px rgba(0, 0, 0, 0.02);
            position: relative;
        }

        /* صورة الشيخ مع إطار ذهبي فخم */
        .avatar-wrapper {
            width: 135px;
            height: 135px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            background: var(--gold-gradient);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.25);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ffffff;
        }

        /* الاسم والصفة */
        .name {
            font-family: 'Amiri', serif;
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 6px;
        }

        .title-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--gold-dark);
            background-color: var(--gold-light);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 8px 18px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        /* اقتباس ديني / موعظة */
        .quote-box {
            background: #fafafa;
            border-right: 3px solid var(--gold-primary);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-family: 'Amiri', serif;
            font-size: 15px;
            color: #4b5563;
            font-style: italic;
        }

        .section-title {
            text-align: right;
            font-size: 14px;
            font-weight: 700;
            color: var(--gold-dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #f3f4f6;
        }

        /* قائمة الأزرار الذهبية */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .gold-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-radius: 16px;
            text-decoration: none;
            background: var(--gold-button);
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(184, 145, 34, 0.25);
            transition: all 0.3s ease;
            border: none;
        }

        .gold-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(184, 145, 34, 0.35);
            filter: brightness(1.05);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-content i {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .arrow-icon {
            font-size: 12px;
            opacity: 0.8;
        }

        /* أزرار الإجراءات التفاعلية */
        .actions-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 13px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .action-btn.gold-solid {
            background: var(--gold-button);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
        }

        .action-btn.gold-outline {
            background: #ffffff;
            color: var(--gold-dark);
            border: 1.5px solid var(--gold-primary);
        }

        .action-btn:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="nfc-card">
        <!-- صورة الشيخ -->
        <div class="avatar-wrapper">
            <img src="imam.jpeg" alt="الشيخ عبد الحكيم مصطفاوي" class="avatar-img">
        </div>

        <!-- الاسم والصفة -->
        <h1 class="name">الشيخ عبد الحكيم مصطفاوي</h1>
        <div class="title-badge">
            <i class="fa-solid fa-mosque"></i>
            <span>إمام مسجد الرحمان - إغيل أوعزوق - بجاية</span>
        </div>

        <!-- اقتباس / موعظة -->
        <div class="quote-box">
            "وَمَنْ أَحْسَنُ قَوْلًا مِّمَّن دَعَا إِلَى اللَّهِ وَعَمِلَ صَالِحًا"
        </div>

        <div class="section-title">
            <i class="fa-solid fa-link"></i> منصات التواصل الاجتماعي
        </div>

        <!-- الأزرار الذهبية للروابط -->
        <div class="links-container">
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@a.hakim_mostefaoui?_r=1&_t=ZS-9AcG8hdw0Be" target="_blank" class="gold-btn">
                <div class="btn-content">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>حساب التيك توك</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- YouTube -->
            <a href="https://m.youtube.com/@mostefaouihakim-06?si=8pn-mfb1JRQ9yfvh" target="_blank" class="gold-btn">
                <div class="btn-content">
                    <i class="fa-brands fa-youtube"></i>
                    <span>قناة اليوتيوب الرسمية</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/19A83HY2QL/?mibextid=wwXIfr" target="_blank" class="gold-btn">
                <div class="btn-content">
                    <i class="fa-brands fa-facebook-f"></i>
                    <span>صفحة الفيسبوك</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>
        </div>

        <div class="section-title">
            <i class="fa-solid fa-sliders"></i> خيارات التفاعل
        </div>

        <!-- أزرار التفاعل (حفظ الصفحة ومشاركة) -->
        <div class="actions-container">
            <button class="action-btn gold-solid" onclick="savePage()">
                <i class="fa-solid fa-bookmark"></i> حفظ الصفحة
            </button>
            <button class="action-btn gold-outline" onclick="shareCard()">
                <i class="fa-solid fa-share-nodes"></i> مشاركة
            </button>
        </div>

        <div class="footer">
            البطاقة الرقمية الرسمية © NFC
        </div>
    </div>

    <script>
        // دالة مشاركة رابط الصفحة
        function shareCard() {
            if (navigator.share) {
                navigator.share({
                    title: 'الشيخ عبد الحكيم مصطفاوي',
                    text: 'بطاقة التواصل للشيخ عبد الحكيم مصطفاوي',
                    url: window.location.href
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ رابط الصفحة بنجاح!');
            }
        }

        // دالة حفظ الصفحة (الإشارات المرجعية / إضافة للشاشة)
        function savePage() {
            const userAgent = navigator.userAgent.toLowerCase();
            
            if (window.sidebar && window.sidebar.addPanel) { 
                window.sidebar.addPanel(document.title, window.location.href, '');
            } else if (window.external && ('AddFavorite' in window.external)) { 
                window.external.AddFavorite(location.href, document.title);
            } else {
                if (userAgent.includes('iphone') || userAgent.includes('ipad')) {
                    alert('لحفظ الصفحة على أجهزة iPhone:\nاضغط على زر المشاركة أسفل الشاشة ثم اختر "إضافة إلى الشاشة الرئيسية" أو "إضافة إشارة مرجعية".');
                } else if (userAgent.includes('android')) {
                    alert('لحفظ الصفحة على أجهزة Android:\nاضغط على النقاط الثلاث (⋮) أعلى المتصفح ثم اختر "إضافة إلى الشاشة الرئيسية" أو "إضافة إلى المفضلة".');
                } else {
                    alert('لحفظ الصفحة:\nاضغط على (Ctrl + D) في لوحة المفاتيح لإضافة الصفحة إلى المفضلة.');
                }
            }
        }
    </script>
</body>
</html>
